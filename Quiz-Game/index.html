<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start-screen">
        <h1>Quiz Time!</h1>
        <p>Test your knowledge with fun questions</p>
        <button id="start-button">Start Quiz</button>
      </div>

      <div class="screen" id="quiz-screen">
        <div class="quiz-header">
          <h2 id="question">Question goes here</h2>
          <div class="quiz-info">
            <p>
              Question <span id="question-number">1</span> of
              <span id="total-questions">10</span>
            </p>
            <p>Score: <span id="score">0</span></p>
          </div>
        </div>

        <div class="answers-container" id="answers-container">
          <!-- Answer buttons will be dynamically generated here -->
        </div>

        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>

        <div class="screen" id="results-screen">
          <h1>Quiz Results</h1>
          <div class="result-info">
            <p>
              You scored <span id="final-score">0</span> out of
              <span id="max-score">10</span>
            </p>
            <div id="result-message">Good Job!</div>
            <button id="restart-button">Restart Quiz</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
