<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="src/color-picker.png" />
  </head>
  <body>
    <main>
      <div class="container">
        <h1>Color Palette Generator</h1>
        <button id="generate-btn">
          <i class="fas fa-sync-alt"></i>
          Generate Palette
        </button>

        <div class="palette-container">
          <div class="color-box">
            <div class="color" style="background-color: #e1f5fe"></div>
            <div class="color-info">
              <span class="hex-value">#E1F5FE</span>
              <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
          </div>

          <div class="color-box">
            <div class="color" style="background-color: #b3e5fc"></div>
            <div class="color-info">
              <span class="hex-value">#B3E5FC</span>
              <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
          </div>

          <div class="color-box">
            <div class="color" style="background-color: #81d4fa"></div>
            <div class="color-info">
              <span class="hex-value">#81D4FA</span>
              <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
          </div>

          <div class="color-box">
            <div class="color" style="background-color: #4fc3f7"></div>
            <div class="color-info">
              <span class="hex-value">#4FC3F7</span>
              <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
          </div>

          <div class="color-box">
            <div class="color" style="background-color: #29b6f6"></div>
            <div class="color-info">
              <span class="hex-value">#29B6F6</span>
              <i class="far fa-copy copy-btn" title="Copy to clipboard"></i>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <p>
        Created by
        <a href="https://github.com/abdourhd" target="_blank">Abdou</a>
      </p>
      <p>
        <a
          href="https://www.instagram.com/yoki_corp?igsh=MTljcGZvM2lhaWswcA=="
          target="_blank"
          >YokiCorp</a
        >&copy; 2022
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
